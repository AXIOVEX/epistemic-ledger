[package]
name = "epistemic-ledger-core"
version = "0.14.0"
edition.workspace = true
license.workspace = true
description = "Core storage and verification engine for the epistemic ledger (DESIGN-13)."

[dependencies]
sha2 = "0.10"
ed25519-dalek = "2"
curve25519-dalek = "4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
crc32c = "0.6"
hex = "0.4"
fs2 = "0.4"
