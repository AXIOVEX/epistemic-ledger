[package]
name = "epistemic-ledger-core"
version = "0.13.0"
edition.workspace = true
license.workspace = true
description = "Core storage and verification engine for the epistemic ledger (DESIGN-13)."

[dependencies]
sha2 = "0.10"
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crc32c = "0.6"
hex = "0.4"
