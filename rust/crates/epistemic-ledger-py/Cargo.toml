[package]
name = "epistemic-ledger-py"
version = "0.14.0"
edition.workspace = true
license.workspace = true
description = "PyO3 bindings for epistemic-ledger-core (DESIGN-13 stage 2)."

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py310", "extension-module"] }
epistemic-ledger-core = { path = "../epistemic-ledger-core" }
serde_json = { version = "1", features = ["float_roundtrip"] }
hex = "0.4"
ed25519-dalek = "2"
