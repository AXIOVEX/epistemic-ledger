name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      # Scope: the package and its tests. The research harnesses under
      # prototype/ are the measured-results record, not shipped code.
      - run: ruff check src tests

  format:
    name: Format (ruff format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      - run: ruff format --check src tests

  types:
    name: Types (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . "mypy>=1.11"
      - run: mypy src/epistemic_ledger

  test:
    name: Test (py${{ matrix.python }} · ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest]
        include:
          - python: "3.12"
            os: windows-latest
          - python: "3.12"
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: python -m pytest

  coverage:
    name: Coverage (floors enforced)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # Overall floor 85%; the core ledger module floor 90% (line rate)
      # is checked separately from the coverage data below. Measured at
      # packaging time: overall 88%, ledger.py 91% — the main uncovered
      # area is the consolidation module's live network client, which
      # unit tests deliberately do not call.
      - run: >-
          python -m pytest
          --cov=epistemic_ledger --cov-report=xml --cov-report=term-missing
          --cov-fail-under=85
      - name: Core-module floor (90%)
        run: |
          python - <<'EOF'
          import xml.etree.ElementTree as ET
          tree = ET.parse("coverage.xml")
          for cls in tree.getroot().iter("class"):
              if cls.get("filename", "").endswith("ledger.py"):
                  rate = float(cls.get("line-rate"))
                  print(f"ledger.py line coverage: {rate:.1%}")
                  assert rate >= 0.90, "core module below the 90% floor"
                  break
          else:
              raise SystemExit("ledger.py not found in coverage report")
          EOF
      - uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  docs:
    name: Docs (mkdocs --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[docs]"
      - run: mkdocs build --strict

  build:
    name: Build + install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Wheel contents are clean
        run: |
          python - <<'EOF'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          bad = [n for n in names if "validation" in n or n.endswith(".jsonl")
                 or "lora" in n.lower()]
          assert not bad, f"research artifacts leaked into the wheel: {bad}"
          assert any(n.startswith("epistemic_ledger/ledger.py") for n in names)
          print(f"{wheel}: {len(names)} files, clean")
          EOF
      - name: Install the wheel in a clean venv and smoke-test it
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cd /tmp && /tmp/smoke/bin/python -c "from epistemic_ledger import Ledger, __version__; print('import ok', __version__)"
          /tmp/smoke/bin/epistemic-ledger demo | head -5
          /tmp/smoke/bin/epistemic-ledger --version

  rust:
    name: Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy (problems annotated on the PR)
        run: |
          cargo clippy --manifest-path rust/Cargo.toml --all-targets --message-format json 2>/dev/null | python3 -c "
          import json, sys
          failed = False
          for line in sys.stdin:
              try: msg = json.loads(line)
              except Exception: continue
              if msg.get('reason') != 'compiler-message': continue
              m = msg['message']
              code = (m.get('code') or {}).get('code', '')
              if m['level'] not in ('error', 'warning'): continue
              if not code.startswith('clippy::') and m['level'] != 'error': continue
              failed = True
              spans = [s for s in m['spans'] if s['is_primary']] or m['spans']
              text = m['message'].replace('%', '%25').replace(chr(13), '%0D').replace(chr(10), '%0A')
              if spans:
                  s = spans[0]
                  print(f\"::error file={s['file_name']},line={s['line_start']},col={s['column_start']}::{code} {text}\")
              else:
                  print(f'::error::{code} {text}')
          sys.exit(1 if failed else 0)
          "
      - run: cargo test --manifest-path rust/Cargo.toml

  bindings:
    name: Rust bindings (PyO3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m venv /tmp/bindings-venv
      - run: /tmp/bindings-venv/bin/pip install -q maturin pytest cryptography
      - run: /tmp/bindings-venv/bin/pip install -q .
      - name: Build and install the bindings into the venv
        env:
          VIRTUAL_ENV: /tmp/bindings-venv
        run: cd rust/crates/epistemic-ledger-py && /tmp/bindings-venv/bin/maturin develop
      - name: Diagnose bindings environment
        run: |
          SP=$(/tmp/bindings-venv/bin/python -c "import site; print(site.getsitepackages()[0])")
          echo "::error::site-packages $SP"
          find "$SP" -maxdepth 3 -name "*_core*" | head -5 | while IFS= read -r line; do echo "::error::found $line"; done
          ls "$SP/epistemic_ledger" 2>/dev/null | head -20 | while IFS= read -r line; do echo "::error::pkg $line"; done
          /tmp/bindings-venv/bin/python -c "import epistemic_ledger; print('pkg ok')" 2>&1 | tail -2 | while IFS= read -r line; do echo "::error::pkgimport $line"; done
          /tmp/bindings-venv/bin/python -c "import epistemic_ledger._core; print('core ok')" 2>&1 | tail -2 | while IFS= read -r line; do echo "::error::coreimport $line"; done
          true
      - name: Run bindings tests (failures annotated)
        run: |
          set +e
          /tmp/bindings-venv/bin/python -m pytest rust/crates/epistemic-ledger-py/tests -q > /tmp/pytest.out 2>&1
          rc=$?
          grep -E "^(FAILED|ERROR)" /tmp/pytest.out | head -20 | while IFS= read -r line; do echo "::error::$line"; done
          sed -n '/FAILURES/,/short test summary/p' /tmp/pytest.out | head -45 | while IFS= read -r line; do echo "::error::$line"; done
          sed -n '/ERRORS/,/short test summary/p' /tmp/pytest.out | head -45 | while IFS= read -r line; do echo "::error::$line"; done
          exit $rc
