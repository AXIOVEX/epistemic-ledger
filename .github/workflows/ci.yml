name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      # Scope: the package and its tests. The research harnesses under
      # prototype/ are the measured-results record, not shipped code.
      - run: ruff check src tests

  format:
    name: Format (ruff format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      - run: ruff format --check src tests

  types:
    name: Types (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . "mypy>=1.11"
      - name: Type check (errors annotated)
        run: |
          set +e
          mypy src/epistemic_ledger > /tmp/mypy.out 2>&1
          rc=$?
          grep -E "error:" /tmp/mypy.out | head -20 | while IFS= read -r line; do echo "::error::$line"; done
          tail -2 /tmp/mypy.out | while IFS= read -r line; do echo "::error::mypy $line"; done
          exit $rc

  test:
    name: Test (py${{ matrix.python }} · ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest]
        include:
          - python: "3.12"
            os: windows-latest
          - python: "3.12"
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - name: Run tests (failures annotated)
        shell: bash
        run: |
          set +e
          python -m pytest > /tmp/test.out 2>&1
          rc=$?
          grep -E "^(FAILED|ERROR)" /tmp/test.out | head -20 | while IFS= read -r line; do echo "::error::$line"; done
          grep -E "^E " /tmp/test.out | head -30 | while IFS= read -r line; do echo "::error::E $line"; done
          tail -2 /tmp/test.out | while IFS= read -r line; do echo "::error::pytest $line"; done
          exit $rc

  coverage:
    name: Coverage (floors enforced)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # Overall floor 85%; the core ledger module floor 90% (line rate)
      # is checked separately from the coverage data below. Measured at
      # packaging time: overall 88%, ledger.py 91% — the main uncovered
      # area is the consolidation module's live network client, which
      # unit tests deliberately do not call.
      - run: >-
          python -m pytest
          --cov=epistemic_ledger --cov-report=xml --cov-report=term-missing
          --cov-fail-under=85
      - name: Core-module floor (90%)
        run: |
          python - <<'EOF'
          import xml.etree.ElementTree as ET
          tree = ET.parse("coverage.xml")
          for cls in tree.getroot().iter("class"):
              if cls.get("filename", "").endswith("ledger.py"):
                  rate = float(cls.get("line-rate"))
                  print(f"ledger.py line coverage: {rate:.1%}")
                  assert rate >= 0.90, "core module below the 90% floor"
                  break
          else:
              raise SystemExit("ledger.py not found in coverage report")
          EOF
      - uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  docs:
    name: Docs (mkdocs --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[docs]"
      - run: mkdocs build --strict

  battery:
    name: Battery + budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m venv /tmp/battery-venv
      - run: /tmp/battery-venv/bin/pip install -q maturin pytest cryptography hypothesis
      - name: Build the bindings wheel
        run: cd rust/crates/epistemic-ledger-py && /tmp/battery-venv/bin/maturin build --release --interpreter /tmp/battery-venv/bin/python -o /tmp/wheels
      - run: /tmp/battery-venv/bin/pip install -q /tmp/wheels/*.whl
      # The real package installs last so its __init__ replaces the
      # bindings wheel's shim; the compiled _core stays beside it.
      - run: /tmp/battery-venv/bin/pip install -q .
      - name: Run the adversarial battery (failures annotated)
        run: |
          set +e
          /tmp/battery-venv/bin/python -m pytest rust/crates/epistemic-ledger-py/tests/test_battery.py -q > /tmp/battery.out 2>&1
          rc=$?
          grep -E "^(FAILED|ERROR)" /tmp/battery.out | head -20 | while IFS= read -r line; do echo "::error::$line"; done
          grep -E "^E " /tmp/battery.out | head -30 | while IFS= read -r line; do echo "::error::E $line"; done
          exit $rc
      # Diagnostics: the main suite also runs in the Test jobs, but
      # those do not surface failures as annotations; this step
      # annotates them here without failing this job. It runs
      # before the bench so a bench failure cannot skip it.
      - name: Main suite (diagnostic, annotated)
        run: |
          set +e
          /tmp/battery-venv/bin/python -m pytest tests -q > /tmp/main.out 2>&1
          grep -E "^(FAILED|ERROR)" /tmp/main.out | head -20 | while IFS= read -r line; do echo "::error::$line"; done
          grep -E "^E " /tmp/main.out | head -30 | while IFS= read -r line; do echo "::error::E $line"; done
          true
      - name: Enforce the performance budgets (DESIGN-13 section 8)
        run: |
          set -o pipefail
          /tmp/battery-venv/bin/python -u tools/bench_budgets.py 2>&1 | while IFS= read -r line; do echo "::error::bench $line"; done

  build:
    name: Build + install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Wheel contents are clean
        run: |
          python - <<'EOF'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          bad = [n for n in names if "validation" in n or n.endswith(".jsonl")
                 or "lora" in n.lower()]
          assert not bad, f"research artifacts leaked into the wheel: {bad}"
          assert any(n.startswith("epistemic_ledger/ledger.py") for n in names)
          print(f"{wheel}: {len(names)} files, clean")
          EOF
      - name: Install the wheel in a clean venv and smoke-test it
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cd /tmp && /tmp/smoke/bin/python -c "from epistemic_ledger import Ledger, __version__; print('import ok', __version__)"
          /tmp/smoke/bin/epistemic-ledger demo | head -5
          /tmp/smoke/bin/epistemic-ledger --version

  rust:
    name: Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy (problems annotated on the PR)
        run: |
          cargo clippy --manifest-path rust/Cargo.toml --all-targets --message-format json 2>/dev/null | python3 -c "
          import json, sys
          failed = False
          for line in sys.stdin:
              try: msg = json.loads(line)
              except Exception: continue
              if msg.get('reason') != 'compiler-message': continue
              m = msg['message']
              code = (m.get('code') or {}).get('code', '')
              if m['level'] not in ('error', 'warning'): continue
              if not code.startswith('clippy::') and m['level'] != 'error': continue
              failed = True
              spans = [s for s in m['spans'] if s['is_primary']] or m['spans']
              text = m['message'].replace('%', '%25').replace(chr(13), '%0D').replace(chr(10), '%0A')
              if spans:
                  s = spans[0]
                  print(f\"::error file={s['file_name']},line={s['line_start']},col={s['column_start']}::{code} {text}\")
              else:
                  print(f'::error::{code} {text}')
          sys.exit(1 if failed else 0)
          "
      - run: cargo test --manifest-path rust/Cargo.toml

  bindings:
    name: Rust bindings (PyO3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m venv /tmp/bindings-venv
      - run: /tmp/bindings-venv/bin/pip install -q maturin pytest cryptography
      - name: Build the bindings wheel
        run: cd rust/crates/epistemic-ledger-py && /tmp/bindings-venv/bin/maturin build --release --interpreter /tmp/bindings-venv/bin/python -o /tmp/wheels
      - run: /tmp/bindings-venv/bin/pip install -q /tmp/wheels/*.whl
      # The real package installs last so its __init__ replaces the
      # bindings wheel's shim; the compiled _core stays beside it.
      - run: /tmp/bindings-venv/bin/pip install -q .
      - name: Run bindings tests (failures annotated)
        run: |
          set +e
          /tmp/bindings-venv/bin/python -c "import epistemic_ledger._core as c; print('core file:', c.__file__)" > /tmp/probe.out 2>&1
          if [ $? -ne 0 ]; then tail -5 /tmp/probe.out | while IFS= read -r line; do echo "::error::probe $line"; done; fi
          /tmp/bindings-venv/bin/python -m pytest rust/crates/epistemic-ledger-py/tests -q > /tmp/pytest.out 2>&1
          rc=$?
          grep -E "^(FAILED|ERROR)" /tmp/pytest.out | head -20 | while IFS= read -r line; do echo "::error::$line"; done
          grep -E "^[A-Za-z_.]+(Error|Exception)" /tmp/pytest.out | head -20 | while IFS= read -r line; do echo "::error::exc $line"; done
          grep -E "^(E |E  )" /tmp/pytest.out | head -20 | while IFS= read -r line; do echo "::error::E $line"; done
          exit $rc
