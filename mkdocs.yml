site_name: Epistemic Ledger
site_description: A living epistemic ledger — append-only conclusions with fluid certainty scores, revised as new facts arrive.
site_url: https://epistemic-ledger.readthedocs.io/
repo_url: https://github.com/AXIOVEX/epistemic-ledger
repo_name: AXIOVEX/epistemic-ledger
copyright: Copyright © 2026 Axiovex Systems, LLC — code MIT; documents all rights reserved.

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
  - admonition
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Concepts: concepts.md
  - LQL query language: lql.md
  - MCP server: mcp.md
  - Framing paper: PAPER.md
  - Design memos:
      - "01 · Record schema and scoring calculus": DESIGN-01-record-schema-scoring.md
      - "02 · Contradiction resolution": DESIGN-02-contradiction-resolution.md
      - "03 · Learned entrenchment": DESIGN-03-learned-entrenchment.md
      - "04 · D–S intervals": DESIGN-04-ds-intervals.md
      - "05 · Joint likelihoods": DESIGN-05-joint-likelihoods.md
      - "06 · Governance": DESIGN-06-governance.md
      - "07 · Follow-through bundle": DESIGN-07-followthrough-bundle.md
      - "08 · Consolidation": DESIGN-08-consolidation.md
      - "09 · Normalized churn": DESIGN-09-normalized-churn.md
      - "10 · Governance hardening": DESIGN-10-governance-hardening.md
      - "11 · Partitions and predicate policies": DESIGN-11-partitions-and-predicate-policies.md
      - "12 · Hardening": DESIGN-12-hardening.md
      - "13 · Ledger hardening": DESIGN-13-ledger-hardening.md
      - "14 · Verified writes": DESIGN-14-verified-writes.md
      - "15 · Arcturus substrate": DESIGN-15-arcturus-substrate.md
      - "16 · Stress and robustness": DESIGN-16-stress-robustness.md
  - Result reports:
      - CALIBRATION-01.md
      - CHURN-01.md
      - CONSOLIDATION-01.md
      - CONTEXT-CLEANUP-01.md
      - FREETEXT-01.md
      - INDIE-CORPUS-01.md
      - KILL-BARS-01.md
      - LOCAL-CONSOLIDATION-01.md
      - LOCAL-EXTRACTION-01.md
      - LORA-01.md
      - LORA-02.md
      - NEWSROOM-01.md
      - OVERRIDE-CAL-01.md
      - OVERRIDE-CAL-02.md
      - REALWIRE-01.md
      - REPO-HISTORY-VALIDATION.md
      - STANCE-01.md
      - STANCE-02.md
      - TRIGGER-STRESS-01.md
  - Research notes:
      - research/report.md
      - research/BIBLIOGRAPHY.md
      - research/notes/topic-01-bitemporal.md
      - research/notes/topic-02-belief-revision.md
      - research/notes/topic-03-tms.md
      - research/notes/topic-04-event-sourcing.md
      - research/notes/topic-05-incremental.md
      - research/notes/topic-06-trigger-problem.md
